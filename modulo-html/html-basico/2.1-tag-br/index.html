<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag < br ></title>
</head>
<body>
    <h3>A tag < br > em HTML serve para criar uma quebra de linha simples em um texto.</h3>
    <h4>Este é um único parágrafo:</h4>
    <p>Hello, world!<br>This is a new line.</p>
</body>
</html>
