<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/style.css">
    <title>Frontend Mentor | Profile card component</title>
    
</head>
<body>
    <main class="container">
        <div class="card">
            <div class="info-pessoal">
                <img class= "img-avatar" src="src/img.png" alt="imagem-avatar">
                <p class="name">Ligiane Périco <span class="age">22</span></p>
                <span class="country">Brasil</span>
            </div>
            <hr>
            <ul class="profile-numbers">
                <li class="info">
                    <p class="counter">80K</p>
                    <span class="counter-type">Followers</span>
                </li>
                <li class="info">
                    <p class="counter">803K</p>
                    <span class="counter-type">Likes</span>
                </li>
                <li class="info">
                    <p class="counter">1.4K</p>
                    <span class="counter-type">Photos</span>
                </li>
            </ul>
        
        </div>
    </main>
</body>
</html>
